[build-system]
requires=["hatchling"]
build-backend="hatchling.build"

[project]
name="velora"
version="0.1.0"
requires-python=">=3.13"

[project.scripts]
velora="velora.__main__:main"

[tool.hatch.build.targets.wheel]
packages=["src/velora"]

[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["src"]
